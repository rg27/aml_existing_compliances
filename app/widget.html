<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance Screening Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#0f172a', 'primary-dark': '#020617' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-slate-50 p-4 font-sans antialiased text-slate-900 w-full min-h-screen">
    <div class="w-full mx-auto">
        <div id="main-wrapper" class="w-full">
            <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden flex flex-col w-full h-full">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center shrink-0">
                    <h2 class="text-[10px] font-black text-slate-700 uppercase tracking-[0.2em]">Compliance Past Records</h2>
                </div>
                
                <div class="max-h-[460px] overflow-y-auto w-full relative bg-white">
                    <table class="w-full text-left border-collapse table-auto">
                        <thead class="sticky top-0 z-30 shadow-sm bg-slate-50">
                            <tr class="text-[10px] font-bold text-slate-500 uppercase tracking-widest bg-slate-50">
                            <th class="px-3 py-3 bg-slate-50 sticky top-0">Compliance Name</th>
                            <th class="px-3 py-3 bg-slate-50 text-center sticky top-0">CR Score</th>
                            <th class="px-3 py-3 bg-slate-50 text-center sticky top-0">BR Score</th>
                            <th class="px-3 py-3 bg-slate-50 text-center sticky top-0">GR Score</th>
                            <th class="px-3 py-3 bg-slate-50 text-center sticky top-0">Calculated Stakeholder RR</th>
                            <th class="px-3 py-3 bg-slate-50 text-center sticky top-0">Officer Stakeholder RR</th>
                            <th class="px-3 py-3 bg-slate-50 text-center sticky top-0">Application</th>
                            <th class="px-3 py-3 bg-slate-50 text-center sticky top-0">Conclusion Date</th>
                            <th class="px-3 py-3 bg-slate-50 text-center sticky top-0">EDD</th>
                        </tr>
                        </thead>
                        <tbody id="credential-body" class="divide-y divide-slate-100 text-sm">
                            <tr>
                                <td colspan="7" class="px-6 py-12 text-center text-slate-400 italic text-xs">
                                    <div id="loading-log-container" class="inline-block text-left font-mono text-[10px] space-y-1 bg-slate-900 text-slate-300 p-4 rounded-lg shadow-inner max-w-md w-full border border-slate-800">
                                        <div class="text-emerald-400 flex items-center"><span class="animate-pulse mr-1.5">●</span> [SYSTEM] Initializing background sequence...</div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="alert-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-6 text-center">
                <h3 id="alert-title" class="text-sm font-bold text-slate-800 uppercase tracking-wider">Status</h3>
                <p id="alert-message" class="mt-2 text-[11px] text-slate-500 leading-relaxed"></p>
                <div id="alert-actions" class="flex space-x-3 pt-6"></div>
            </div>
        </div>
    </div>

    <script src="https://live.zwidgets.com/js-sdk/1.1/ZohoEmbededAppSDK.min.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
